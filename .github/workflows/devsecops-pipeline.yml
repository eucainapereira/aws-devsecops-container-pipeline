name: AWS DevSecOps Container Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  # Execucao semanal toda segunda-feira as 03:00 UTC para reconstruir a imagem
  # Alpine Linux com os ultimos patches de seguranca e revalidar CVEs
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read
  id-token: write

env:
  AWS_REGION: ${{ secrets.AWS_REGION || vars.AWS_REGION || 'us-east-1' }}
  ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY || vars.ECR_REPOSITORY || 'aws-devsecops-container-pipeline' }}
  CONTAINER_NAME: aws-devsecops-app

jobs:
  # ===========================================================================
  # JOB 1: SHIFT-LEFT SECURITY & QUALITY GATES (Gitleaks + Semgrep + Trivy)
  # ===========================================================================
  security-quality-gates:
    name: "Quality Gates (Gitleaks, Semgrep, Trivy IaC & Image)"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Repositorio (Historico Completo)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # -----------------------------------------------------------------------
      # FERRAMENTA 1: GITLEAKS (Secrets Detection)
      # -----------------------------------------------------------------------
      - name: "[1/4] Gitleaks - Varredura de Segredos no Historico Git"
        run: |
          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/repo" \
            zricethezav/gitleaks:latest \
            detect --source="/repo" --verbose --redact --exit-code 1

      # -----------------------------------------------------------------------
      # FERRAMENTA 2: SEMGREP (SAST - Static Application Security Testing)
      # -----------------------------------------------------------------------
      - name: "[2/4] Semgrep - Analise Estatica de Codigo e Configuracoes (SAST)"
        run: |
          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/src" \
            semgrep/semgrep:latest \
            semgrep scan \
              --config p/default \
              --error \
              /src/app /src/docker

      # -----------------------------------------------------------------------
      # FERRAMENTA 3 (Etapa A): TRIVY CONFIG (IaC - Terraform & Dockerfile)
      # -----------------------------------------------------------------------
      - name: "[3/4 - Etapa A] Trivy Config - Auditoria de IaC (/terraform e /docker/Dockerfile)"
        run: |
          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/work" \
            -w /work \
            ghcr.io/aquasecurity/trivy:latest config \
              --severity HIGH,CRITICAL \
              --ignorefile .trivyignore \
              --exit-code 1 \
              ./terraform ./docker/Dockerfile

      # -----------------------------------------------------------------------
      # FERRAMENTA 3 (Etapa B): BUILD DA IMAGEM DOCKER ALPINE NON-ROOT
      # -----------------------------------------------------------------------
      - name: "[3/4 - Etapa B] Build da Imagem Docker Hardened (Nginx Alpine Non-Root)"
        run: |
          docker build \
            --file docker/Dockerfile \
            --tag "${ECR_REPOSITORY}:${GITHUB_SHA}" \
            --tag "${ECR_REPOSITORY}:latest" \
            .

      - name: Smoke Test Local do Container (Validacao de Porta 8080, Non-Root e Headers)
        run: |
          docker run -d --name smoke-test -p 8080:8080 "${ECR_REPOSITORY}:${GITHUB_SHA}"
          sleep 3
          curl -fsS -I http://127.0.0.1:8080/healthz
          RUNNING_USER=$(docker exec smoke-test whoami)
          echo "Usuario em execucao no container: ${RUNNING_USER}"
          if [ "${RUNNING_USER}" = "root" ]; then
            echo "ERRO CRITICO: O container esta rodando como root!"
            exit 1
          fi
          docker rm -f smoke-test

      # -----------------------------------------------------------------------
      # FERRAMENTA 3 (Etapa C): TRIVY IMAGE (Container Vulnerability Scanning)
      # -----------------------------------------------------------------------
      - name: "[3/4 - Etapa C] Trivy Image - Scan de Vulnerabilidades (CVEs HIGH/CRITICAL)"
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            ghcr.io/aquasecurity/trivy:latest image \
              --severity HIGH,CRITICAL \
              --ignore-unfixed \
              --scanners vuln \
              --exit-code 1 \
              "${ECR_REPOSITORY}:${GITHUB_SHA}"

  # ===========================================================================
  # JOB 2: PROVISIONAMENTO, PUSH ECR, DEPLOY VIA AWS SSM & DAST (OWASP ZAP)
  # ===========================================================================
  deploy-and-dast:
    name: "Deploy (ECR + AWS SSM) & DAST (OWASP ZAP)"
    runs-on: ubuntu-latest
    needs: security-quality-gates
    if: github.event_name != 'pull_request'

    steps:
      - name: Checkout do Codigo
        uses: actions/checkout@v4

      - name: Configurar Credenciais AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Configurar Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: Verificar ou Provisionar Infraestrutura na AWS (Terraform)
        id: infra
        env:
          SECRET_INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
          SECRET_PUBLIC_IP: ${{ secrets.EC2_PUBLIC_IP }}
        run: |
          INSTANCE_ID="${SECRET_INSTANCE_ID}"
          PUBLIC_IP="${SECRET_PUBLIC_IP}"

          if [ -z "${INSTANCE_ID}" ]; then
            echo "Verificando se a instancia EC2 (${ECR_REPOSITORY}-ec2) ja existe na AWS..."
            INSTANCE_ID=$(aws ec2 describe-instances \
              --filters \
                "Name=tag:Name,Values=${ECR_REPOSITORY}-ec2" \
                "Name=instance-state-name,Values=pending,running" \
              --query "Reservations[0].Instances[0].InstanceId" \
              --output text || true)
          fi

          if [ -z "${INSTANCE_ID}" ] || [ "${INSTANCE_ID}" = "None" ]; then
            echo "Nenhuma instancia ativa encontrada. Provisionando infraestrutura automaticamente via Terraform..."
            terraform -chdir=terraform init -input=false
            terraform -chdir=terraform apply -auto-approve -input=false

            INSTANCE_ID=$(terraform -chdir=terraform output -raw ec2_instance_id)
            PUBLIC_IP=$(terraform -chdir=terraform output -raw ec2_public_ip)
          else
            echo "Instancia EC2 existente detectada: ${INSTANCE_ID}"
            if [ -z "${PUBLIC_IP}" ]; then
              PUBLIC_IP=$(aws ec2 describe-instances \
                --instance-ids "${INSTANCE_ID}" \
                --query "Reservations[0].Instances[0].PublicIpAddress" \
                --output text)
            fi
          fi

          echo "Instancia EC2 Alvo: ${INSTANCE_ID} (IP Publico: ${PUBLIC_IP})"
          echo "instance_id=${INSTANCE_ID}" >> "${GITHUB_OUTPUT}"
          echo "public_ip=${PUBLIC_IP}" >> "${GITHUB_OUTPUT}"

      - name: Login no Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build e Push da Imagem para o Amazon ECR (Tags latest e Commit SHA)
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          IMAGE_URI="${ECR_REGISTRY}/${ECR_REPOSITORY}"
          echo "Verificando existencia do repositorio ECR ${ECR_REPOSITORY}..."
          aws ecr describe-repositories --repository-names "${ECR_REPOSITORY}" >/dev/null 2>&1 || \
            aws ecr create-repository \
              --repository-name "${ECR_REPOSITORY}" \
              --image-scanning-configuration scanOnPush=true \
              --encryption-configuration encryptionType=AES256

          echo "Construindo e enviando imagem para ${IMAGE_URI}..."
          docker build \
            --file docker/Dockerfile \
            --tag "${IMAGE_URI}:${GITHUB_SHA}" \
            --tag "${IMAGE_URI}:latest" \
            .

          docker push "${IMAGE_URI}:${GITHUB_SHA}"
          docker push "${IMAGE_URI}:latest"

      - name: Deploy Seguro na EC2 via AWS Systems Manager (SSM Run Command - Sem SSH)
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          EC2_INSTANCE_ID: ${{ steps.infra.outputs.instance_id }}
        run: |
          IMAGE_URI="${ECR_REGISTRY}/${ECR_REPOSITORY}"

          echo "Aguardando agente AWS SSM ficar Online na instancia ${EC2_INSTANCE_ID}..."
          for i in {1..36}; do
            SSM_STATUS=$(aws ssm describe-instance-information \
              --filters "Key=InstanceIds,Values=${EC2_INSTANCE_ID}" \
              --query "InstanceInformationList[0].PingStatus" \
              --output text || true)
            if [ "${SSM_STATUS}" = "Online" ]; then
              echo "Agente SSM Online!"
              break
            fi
            echo "Tentativa ${i}/36: Status SSM atual = ${SSM_STATUS}. Aguardando 10s..."
            sleep 10
          done

          echo "Disparando deploy via AWS SSM send-command..."
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${EC2_INSTANCE_ID}" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy automatizado da imagem ${IMAGE_URI}:${GITHUB_SHA}" \
            --parameters commands="[
              \"set -eux\",
              \"for i in \$(seq 1 30); do if command -v docker >/dev/null 2>&1 && systemctl is-active --quiet docker; then break; fi; echo 'Aguardando Docker iniciar...'; sleep 5; done\",
              \"if ! command -v docker >/dev/null 2>&1; then dnf install -y docker && systemctl enable --now docker; fi\",
              \"aws ecr get-login-password --region ${AWS_REGION} | docker login --username AWS --password-stdin ${ECR_REGISTRY}\",
              \"docker pull ${IMAGE_URI}:${GITHUB_SHA}\",
              \"docker tag ${IMAGE_URI}:${GITHUB_SHA} ${IMAGE_URI}:latest\",
              \"docker stop ${CONTAINER_NAME} || true\",
              \"docker rm -f ${CONTAINER_NAME} || true\",
              \"docker run -d --name ${CONTAINER_NAME} --restart unless-stopped -p 80:8080 ${IMAGE_URI}:${GITHUB_SHA}\",
              \"docker image prune -af\"
            ]" \
            --query "Command.CommandId" \
            --output text)

          echo "Comando SSM enviado (CommandId: ${COMMAND_ID}). Aguardando conclusao..."
          aws ssm wait command-executed \
            --command-id "${COMMAND_ID}" \
            --instance-id "${EC2_INSTANCE_ID}" || true

          SSM_FINAL_STATUS=$(aws ssm get-command-invocation \
            --command-id "${COMMAND_ID}" \
            --instance-id "${EC2_INSTANCE_ID}" \
            --query "Status" \
            --output text)

          echo "Resultado da execucao remota via SSM (Status: ${SSM_FINAL_STATUS}):"
          aws ssm get-command-invocation \
            --command-id "${COMMAND_ID}" \
            --instance-id "${EC2_INSTANCE_ID}" \
            --query "[StandardOutputContent, StandardErrorContent]" \
            --output text

          if [ "${SSM_FINAL_STATUS}" != "Success" ]; then
            echo "ERRO: O comando SSM falhou com status ${SSM_FINAL_STATUS}"
            exit 1
          fi

      - name: Aguardar Aplicacao Responder na EC2 (Healthcheck HTTP)
        env:
          EC2_PUBLIC_IP: ${{ steps.infra.outputs.public_ip }}
        run: |
          echo "Verificando disponibilidade de http://${EC2_PUBLIC_IP}/healthz ..."
          for i in {1..24}; do
            if curl -fsS "http://${EC2_PUBLIC_IP}/healthz" >/dev/null 2>&1; then
              echo "Aplicacao online e respondendo com sucesso!"
              curl -I "http://${EC2_PUBLIC_IP}"
              exit 0
            fi
            echo "Tentativa ${i}/24: Aguardando aplicacao subir... (5s)"
            sleep 5
          done
          echo "ERRO: Timeout aguardando resposta HTTP da instancia EC2 em http://${EC2_PUBLIC_IP}/healthz"
          exit 1

      # -----------------------------------------------------------------------
      # FERRAMENTA 4: OWASP ZAP BASELINE SCAN (DAST - Dynamic Security Testing)
      # -----------------------------------------------------------------------
      - name: "[4/4] OWASP ZAP Baseline Scan - DAST contra o IP Publico da EC2"
        env:
          EC2_PUBLIC_IP: ${{ steps.infra.outputs.public_ip }}
        run: |
          mkdir -p "${GITHUB_WORKSPACE}/zap-reports"
          chmod 777 "${GITHUB_WORKSPACE}/zap-reports"

          # Executa o OWASP ZAP Baseline Scan contra a aplicacao em producao na EC2.
          # O parametro -I ignora alertas informativos/warnings leves, mas mantem exit code 1
          # caso qualquer vulnerabilidade FAIL (High/Critical) seja detectada.
          docker run --rm -t \
            -v "${GITHUB_WORKSPACE}/zap-reports:/zap/wrk/:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py \
              -t "http://${EC2_PUBLIC_IP}" \
              -r zap-report.html \
              -J zap-report.json \
              -w zap-report.md \
              -I

      - name: Publicar Relatorio DAST (OWASP ZAP) como Artefato
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owasp-zap-dast-report
          path: zap-reports/
          retention-days: 30
